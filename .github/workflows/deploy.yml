name: Deploy Imported Minecraft Server

on: 
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infrastructure:
      runs-on: ubuntu-latest
    
      steps:
      - name: Checkout code repository
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::466385006262:role/github-actions-terraform-executor
          aws-region: ca-central-1
      
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
      
      - name: Terraform Initialize
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_is_pipeline: true
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_ssh_home_ip: ${{ secrets.HOME_IP }}

      - name: Wait for Ubuntu OS to Boot SSH
        run: sleep 30

      - name: Extract Terraform Outputs
        id: terraform_outputs
        run: |
          echo "minecraft_server_public_ip=$(terraform output -raw minecraft_server_public_ip)" >> $GITHUB_OUTPUT

      - name: Debug Workspace Files
        run: |
          echo "Current working directory:"
          pwd
          echo "Listing all files in workspace:"
          ls -la
      
      - name: Copy Docker Config to EC2 via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ steps.terraform_outputs.outputs.minecraft_server_public_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml" 
          target: "/home/ubuntu/minecraft-docker-server"

      - name: Substitute Secrets in Prometheus Config
        env:
          GRAFANA_CLOUD_URL: ${{ secrets.GRAFANA_CLOUD_URL }}
          GRAFANA_CLOUD_USER: ${{ secrets.GRAFANA_CLOUD_USER }}
          GRAFANA_CLOUD_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
        run: |
          envsubst '${GRAFANA_CLOUD_URL} ${GRAFANA_CLOUD_USER} ${GRAFANA_CLOUD_TOKEN}' < monitoring/prometheus.yml > monitoring/prometheus.yml.tmp
          mv monitoring/prometheus.yml.tmp monitoring/prometheus.yml

      - name: Copy Prometheus Files to EC2 via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ steps.terraform_outputs.outputs.minecraft_server_public_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          source: "monitoring/prometheus.yml" 
          target: "/home/ubuntu/minecraft-docker-server"

      - name: Execute Docker Compose via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.terraform_outputs.outputs.minecraft_server_public_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            while ! command -v docker &> /dev/null || ! command -v docker-compose &> /dev/null; do 
              echo "Still waiting for Docker binaries to initialize..."
              sleep 5 
            done
            
            echo "Docker is fully installed! Proceeding with container deployment..."
            cd /home/ubuntu/minecraft-docker-server
            RCON_PASSWORD="${{ secrets.RCON_PASSWORD }}" \
            MANAGEMENT_SERVER_SECRET="${{ secrets.MANAGEMENT_SERVER_SECRET }}" \
            sudo docker-compose up -d
      
      # For local Grafana container deployments, add GRAFANA_SECURITY_SECRET to envs: and the line: "export GRAFANA_SECURITY_SECRET="${{ secrets.GRAFANA_SECURITY_SECRET }}"" to script:
      - name: Deploy Prometheus via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.terraform_outputs.outputs.minecraft_server_public_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          envs: GRAFANA_CLOUD_URL,GRAFANA_CLOUD_USER,GRAFANA_CLOUD_TOKEN
          script: |
            cd /home/ubuntu/minecraft-docker-server
            export GRAFANA_CLOUD_URL="${{ secrets.GRAFANA_CLOUD_URL }}"
            export GRAFANA_CLOUD_USER="${{ secrets.GRAFANA_CLOUD_USER }}"
            export GRAFANA_CLOUD_TOKEN="${{ secrets.GRAFANA_CLOUD_TOKEN }}"
            
            sudo -E docker-compose up -d

      - name: Server Deployment Summary
        run: |
          echo "Public IP Address: ${{ steps.terraform_outputs.outputs.minecraft_server_public_ip }}"
          echo "Status: Docker containers initiated successfully!"